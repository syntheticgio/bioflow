# Development overrides: hot reload for both backend and frontend.
# Compose loads this automatically. For a production-shaped run use:
#   docker compose -f docker-compose.yml up
services:
  api:
    # The base file names a published image so an end user's machine can pull
    # it. Local development builds from source instead, and this is what makes
    # `docker compose up -d --build` still do that -- the override always
    # loads, and it is now the only place that knows how to build.
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ${BIOINFO_HOME:-/Volumes/ModelExtension/BioinfoHelper}:/data
      - ./backend/app:/srv/app:ro
      # Read at startup to log *which checkout* this bind mount is serving.
      # Only the mounted source decides what code runs, so a checkout parked
      # on a stale branch serves stale code with nothing saying so (#452).
      # Development-only: the shipped image has no source tree, and
      # git_revision.py treats the missing directory as "running an image".
      - ./.git:/srv/.git:ro
      - ./backend/tests:/srv/tests:ro
      # /srv/tests resolves repo root as parents[2] (/srv/tests -> /srv -> /),
      # same as ops/tests' throwaway container -- VERSION must be mounted at
      # that root or tests/test_version_consistency.py's repo-root read 404s.
      - ./VERSION:/VERSION:ro
      # Repo-root files the test containers read (test_compose_agent_servers.py
      # reads the override; test_pi_skills.py reads backend/pi-skills).
      - ./docker-compose.override.yml:/docker-compose.override.yml:ro
      - ./backend/pi-skills:/backend/pi-skills:ro
      # Docker socket and BIOINFO_HOME_HOST moved to docker-compose.yml: they
      # are needed by the shipped stack too, not just local development. See
      # the comment on the api service there.
    environment:
      LOG_LEVEL: DEBUG
      # External stdio MCP servers for the agent, merged into every spawn by
      # AgentService._build_mcp_config(). The commands are the absolute venv
      # console-script paths installed in the image (see backend/Dockerfile).
      # Keep in sync with backend/tests/test_compose_agent_servers.py.
      AGENT_EXTRA_MCP_SERVERS: '{"mcpServers": {"fetch": {"command": "/opt/agent-mcp/venv/bin/mcp-server-fetch"}, "datasets": {"command": "/opt/agent-mcp/venv/bin/ncbi-datasets-mcp"}}}'

  worker:
    build:
      context: ./backend
    command: ["watchfiles", "python -m app.worker_main", "app/"]
    volumes:
      - ${BIOINFO_HOME:-/Volumes/ModelExtension/BioinfoHelper}:/data
      - ./backend/app:/srv/app:ro
      # Same reason as the api service's: the worker runs mounted source too,
      # so it reports the checkout it is serving at startup (#452).
      - ./.git:/srv/.git:ro
      # Docker socket moved to docker-compose.yml. See the comment on the
      # worker service there.
    environment:
      LOG_LEVEL: DEBUG

  web:
    # `context:` is required here now. It used to be inherited from the base
    # file's build block, which this change replaced with an image reference --
    # leaving `target: dev` alone would build nothing and silently run the
    # published prod image instead of local source.
    build:
      context: ./frontend
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ./frontend/src:/srv/src
      - ./frontend/index.html:/srv/index.html
      - ./frontend/vite.config.ts:/srv/vite.config.ts
