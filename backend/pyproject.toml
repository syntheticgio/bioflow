[project]
name = "biopipe-backend"
version = "0.6.0-alpha"
description = "Local bioinformatics data manager - API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "beanie>=2.0,<3.0",
    "pymongo>=4.11,<5.0",
    "redis>=5.2,<9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-slugify>=8.0",
    "psutil>=6.1",
    "aiofiles>=24.1",
    "sse-starlette>=2.1",
    "pysam>=0.23",
    # Fernet, for API keys at rest. See services/ai/crypto.py -- the threat
    # model is a curious look at the Mongo collection, not shell access.
    "cryptography>=44.0",
    # SSH transport for remote node provisioning.
    "asyncssh>=2.18,<3",
    # QUAST's install patch replaces its `distutils.version.LooseVersion`
    # import with `packaging.version.Version` (distutils was removed in
    # Python 3.12) -- see backend/scripts/install-quast.sh. Declared
    # explicitly rather than relied on as a transitive dependency of
    # something else, since a QC tool's importability should not depend on
    # an undeclared side effect of an unrelated package's own requirements.
    "packaging>=24",
    # MCP server, mounted at /api/v1/mcp. Pinned below 3 because the
    # Streamable HTTP transport's ASGI surface is what app/mcp/server.py
    # mounts, and a major bump is where that would change.
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "hypothesis>=6.115",
    "fakeredis[lua]>=2.26",
    "ruff>=0.8",
    "watchfiles>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "heavy: memory-heavy; excluded from the parallel phase and run sequentially afterwards",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
# Pin first-party detection to the package name rather than letting it fall
# back to `src`, which ruff resolves relative to the *invocation* directory.
# Without this, `ruff check` from backend/ sees backend/app and treats `app` as
# first-party, while CI's `ruff check --config backend/pyproject.toml ...` from
# the repo root finds no app/ there and treats it as third-party. The two
# orderings are mutually exclusive, so one of them was always wrong and no file
# layout could satisfy both -- see #510.
known-first-party = ["app"]
