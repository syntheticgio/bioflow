[project]
name = "biopipe-backend"
version = "0.1.0"
description = "Local bioinformatics data manager - API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "beanie>=2.0,<2.1",
    "motor>=3.6",
    "pymongo>=4.9",
    "redis>=5.2,<9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-slugify>=8.0",
    "psutil>=6.1",
    "aiofiles>=24.1",
    "sse-starlette>=2.1",
    "pysam>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "hypothesis>=6.115",
    "fakeredis[lua]>=2.26",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
