name: biopipe

x-backend-env: &backend-env
  MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/biopipe?replicaSet=rs0&directConnection=true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  BIOINFO_HOME: /data
  BIOINFO_REGISTER_ROOTS: ${BIOINFO_REGISTER_ROOTS:-/data}
  LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
  MAX_SIMPLE_UPLOAD_BYTES: ${MAX_SIMPLE_UPLOAD_BYTES:-104857600}
  SRA_ENRICHMENT_ENABLED: ${SRA_ENRICHMENT_ENABLED:-true}
  # The SRA Toolkit writes its configuration and cache here rather than under
  # $HOME, which in a container is often unwritable -- and its failure message
  # ("cannot open configuration") does not point at the cause. Must agree with
  # Settings.ncbi_settings_path, which derives the same path from BIOINFO_HOME.
  NCBI_SETTINGS: /data/tmp/ncbi/user-settings.mkfg
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # The *host* path behind /data. BIOINFO_HOME is already overloaded: it is
  # the host path in the bind mount below, and this file sets it to /data
  # inside the container. A sibling container (DeepVariant, and any future
  # on-demand tool image) gets its mounts from the host, so it needs the host
  # value under a name that cannot be confused with the container path the
  # process already has.
  BIOINFO_HOME_HOST: ${BIOINFO_HOME:-/Volumes/ModelExtension/BioinfoHelper}

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - ./ops/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Self-initiating: the entrypoint script only runs on a fresh data dir,
      # so this also handles an existing volume that was never initiated.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    # api and worker are the same image with different commands -- one build
    # context, one published image, referenced twice. Building them separately
    # would push ~8GB of identical layers twice.
    image: ghcr.io/syntheticgio/bioflow-backend:${BIOFLOW_TAG:-latest}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
    volumes:
      - ${BIOINFO_HOME:-/Volumes/ModelExtension/BioinfoHelper}:/data
      # The api never *runs* a sibling container -- the worker does -- but it
      # still needs to answer "could this run?" at launch time.
      # `tools.require()` in launch_variant_calling probes DeepVariant (and,
      # from #26 on, any on-demand image) before enqueueing, so that an
      # unavailable tool is a clear rejection in the dialog rather than a job
      # that dies thirty seconds after the user walks away. Without the socket
      # here that probe fails and no on-demand tool can ever be launched,
      # however well the worker is set up.
      #
      # This mount used to live only in docker-compose.override.yml, which the
      # native launcher never ships (it bundles this file alone) -- so a
      # launcher-installed user had no socket and DeepVariant silently could
      # not run for them. It belongs here so the shipped stack has it too.
      #
      # A real privilege increase: a container that can reach the daemon can
      # start any container. Accepted because this app is single-user and
      # local. See docs/superpowers/specs/2026-07-31-deepvariant-sidecar-design.md
      # and docs/superpowers/specs/2026-08-05-optional-tool-delivery-design.md.
      - /var/run/docker.sock:/var/run/docker.sock
    # The summary/LLM model runs on the *host*, and llm_base_url reaches it at
    # host.docker.internal (app/config.py). Docker Desktop provides that name
    # for free; Linux does not resolve it at all without this mapping, so the
    # connection fails with a DNS error rather than anything that names the
    # cause. host-gateway is a no-op where the name already works, so this is
    # unconditional rather than platform-branched.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    image: ghcr.io/syntheticgio/bioflow-backend:${BIOFLOW_TAG:-latest}
    command: ["python", "-m", "app.worker_main"]
    environment:
      <<: *backend-env
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-4}
    volumes:
      - ${BIOINFO_HOME:-/Volumes/ModelExtension/BioinfoHelper}:/data
      # The host's Docker socket, so the worker can start sibling containers
      # for tools too large to vendor into this image. DeepVariant is 8.83GB,
      # mostly TensorFlow on a Python 3.10 we do not otherwise ship. See the
      # matching comment on the api service above for why this now lives here
      # rather than only in the override.
      - /var/run/docker.sock:/var/run/docker.sock
    # Same as api: summary_handlers runs in the worker and reaches the host
    # model by this name. See the note on the api service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    # The default 10s would SIGKILL mid-drain, stranding leases. Drain is 60s.
    stop_grace_period: 90s
    restart: unless-stopped

  web:
    image: ghcr.io/syntheticgio/bioflow-web:${BIOFLOW_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
