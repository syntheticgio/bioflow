name: biopipe

# Docker's json-file driver grows without bound by default, and nothing here
# set a logging key -- so a long-running install filled the Docker VM's disk
# with its own logs. That failure is both reachable and hard to read: this
# project's own incident notes record disk exhaustion presenting as a
# crash-looping Mongo, with nothing naming the real cause (#877).
#
# 10MB x 5 is ~50MB per service, ample for the debugging this project does.
# Rotation discards old logs, so anything wanted for forensics has to be
# copied out before it rolls.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/biopipe?replicaSet=rs0&directConnection=true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  BIOINFO_HOME: /data
  BIOINFO_REGISTER_ROOTS: ${BIOINFO_REGISTER_ROOTS:-/data}
  LEASE_TTL_SECONDS: ${LEASE_TTL_SECONDS:-30}
  MAX_SIMPLE_UPLOAD_BYTES: ${MAX_SIMPLE_UPLOAD_BYTES:-104857600}
  SRA_ENRICHMENT_ENABLED: ${SRA_ENRICHMENT_ENABLED:-true}
  # The SRA Toolkit writes its configuration and cache here rather than under
  # $HOME, which in a container is often unwritable -- and its failure message
  # ("cannot open configuration") does not point at the cause. Must agree with
  # Settings.ncbi_settings_path, which derives the same path from BIOINFO_HOME.
  NCBI_SETTINGS: /data/tmp/ncbi/user-settings.mkfg
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # The *host* path behind /data. BIOINFO_HOME is already overloaded: it is
  # the host path in the bind mount below, and this file sets it to /data
  # inside the container. A sibling container (DeepVariant, and any future
  # on-demand tool image) gets its mounts from the host, so it needs the host
  # value under a name that cannot be confused with the container path the
  # process already has.
  BIOINFO_HOME_HOST: ${BIOINFO_HOME:-/Volumes/FastDataExtension/BioinfoHelper}

services:
  mongo:
    image: mongo:7
    logging: *default-logging
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # The host-side publish honours BIND_ADDRESS like api and web do: a
      # loopback install must not leak the unauthenticated database to the
      # network. The in-container --bind_ip_all is a different thing -- it
      # lets child nodes reach Mongo by container name on the Docker
      # network -- and stays.
      - "${BIND_ADDRESS:-0.0.0.0}:${MONGO_PORT:-27017}:27017"
    volumes:
      # Bind-mounted to the fixed ~/.bioflow install directory rather than a
      # named volume, so the database lives at a known host path instead of
      # inside Docker's own managed storage. ~/.bioflow is intentionally
      # fixed and not user-configurable (see launcher/src-tauri/src/commands.rs
      # fixed_install_dir()) -- unlike BIOINFO_HOME/storage location, which
      # the user can change. See docs/superpowers/specs/2026-08-07-mongo-redis-bioflow-home-design.md.
      - ${HOME}/.bioflow/mongo:/data/db
      - ./ops/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy means "a client can write", not merely "a replica set exists".
      # rs.status().ok is 1 the instant the set is configured, while the node
      # is still STARTUP2 and rejecting writes -- so the old probe could report
      # healthy a beat before api and worker could actually use it.
      # hello().isWritablePrimary is the state that matters.
      #
      # The initiate is a fallback for an existing data directory that was
      # never initiated; ops/mongo-init/rs-init.js handles the fresh case and,
      # since that script was fixed, normally gets there first. It stays
      # because it is the only thing that recovers a half-initialised volume,
      # and it is written to match rs-init.js exactly -- a loopback member,
      # for the reasons documented at length in that file.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { db.hello().isWritablePrimary || rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      # Same reasoning as the mongo publish above: a loopback install must
      # not expose the unauthenticated job queue to the network.
      - "${BIND_ADDRESS:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    volumes:
      # See the comment on the mongo service's volumes above.
      - ${HOME}/.bioflow/redis:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    # api and worker are the same image with different commands -- one build
    # context, one published image, referenced twice. Building them separately
    # would push ~8GB of identical layers twice.
    image: ghcr.io/syntheticgio/bioflow-backend:${BIOFLOW_TAG:-latest}
    logging: *default-logging
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      # For the admission-budget clamp only; `api` itself is NOT capped.
      # It cannot read the worker's cgroup, and reading its own would return
      # `max` and silently skip the clamp -- failing open exactly when a
      # guarantee was requested.
      BIOFLOW_HARD_MEM_MB: ${BIOFLOW_HARD_MEM_MB:-}
      # Externally-routable Mongo and Redis URLs for the node-connection
      # endpoint. Passed through from .env rather than computed from the
      # Docker hostname so the user can override them (e.g., to use a
      # different port or hostname on the LAN). Default to the internal
      # Docker hostnames, which the connection endpoint rewrites using
      # the request Host header.
      NODE_CONNECTION_MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/biopipe?replicaSet=rs0&directConnection=true}
      NODE_CONNECTION_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # This machine's LAN address, as a compute node must dial it to reach
      # Mongo, Redis and the API. Must come from outside the container: the
      # API can only discover its own Docker-network address, which is
      # meaningless on another machine, and writing that into a node's .env
      # produced a worker that crash-looped forever while provisioning
      # reported success (#803). Unset is safe -- provisioning refuses to
      # enroll a node rather than guessing.
      PRIMARY_HOSTNAME: ${PRIMARY_HOSTNAME:-}
      # Extra Host header values the API will answer to, comma-separated.
      # Local and LAN names are accepted without any configuration; this is
      # only for a deliberate public or reverse-proxied name, which the host
      # guard would otherwise refuse as a possible DNS-rebinding attempt.
      # See backend/app/middleware/host_guard.py.
      BIOFLOW_ALLOWED_HOSTS: ${BIOFLOW_ALLOWED_HOSTS:-}
    volumes:
      - ${BIOINFO_HOME:-/Volumes/FastDataExtension/BioinfoHelper}:/data
      # The api never *runs* a sibling container -- the worker does -- but it
      # still needs to answer "could this run?" at launch time.
      # `tools.require()` in launch_variant_calling probes DeepVariant (and,
      # from #26 on, any on-demand image) before enqueueing, so that an
      # unavailable tool is a clear rejection in the dialog rather than a job
      # that dies thirty seconds after the user walks away. Without the socket
      # here that probe fails and no on-demand tool can ever be launched,
      # however well the worker is set up.
      #
      # This mount used to live only in docker-compose.override.yml, which the
      # native launcher never ships (it bundles this file alone) -- so a
      # launcher-installed user had no socket and DeepVariant silently could
      # not run for them. It belongs here so the shipped stack has it too.
      #
      # A real privilege increase: a container that can reach the daemon can
      # start any container. Accepted because this app is single-user and
      # local. See docs/superpowers/specs/2026-07-31-deepvariant-sidecar-design.md
      # and docs/superpowers/specs/2026-08-05-optional-tool-delivery-design.md.
      - /var/run/docker.sock:/var/run/docker.sock
    # The summary/LLM model runs on the *host*, and llm_base_url reaches it at
    # host.docker.internal (app/config.py). Docker Desktop provides that name
    # for free; Linux does not resolve it at all without this mapping, so the
    # connection fails with a DNS error rather than anything that names the
    # cause. host-gateway is a no-op where the name already works, so this is
    # unconditional rather than platform-branched.
    extra_hosts:
      - "host.docker.internal:host-gateway"
# Default 0.0.0.0 so compute nodes on other machines can reach the API
    # for auto-discovery. Set BIND_ADDRESS=127.0.0.1 in .env to restrict to
    # localhost only (remote nodes will disconnect).
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    image: ghcr.io/syntheticgio/bioflow-backend:${BIOFLOW_TAG:-latest}
    logging: *default-logging
    # The image's PATH puts Medaka's venv first (it must stay there: the
    # polish jobs call `medaka` by bare name), so a bare `python` is Medaka's
    # interpreter and has none of the app's dependencies -- the worker died
    # on `import pydantic` before it could claim a job. `uvicorn`'s shebang
    # is the same interpreter the api service runs on; name it, don't guess.
    command: ["/usr/local/bin/python3.12", "-m", "app.worker_main"]
    environment:
      <<: *backend-env
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-4}
    volumes:
      - ${BIOINFO_HOME:-/Volumes/FastDataExtension/BioinfoHelper}:/data
      # The host's Docker socket, so the worker can start sibling containers
      # for tools too large to vendor into this image. DeepVariant is 8.83GB,
      # mostly TensorFlow on a Python 3.10 we do not otherwise ship. See the
      # matching comment on the api service above for why this now lives here
      # rather than only in the override.
      - /var/run/docker.sock:/var/run/docker.sock
    # Same as api: summary_handlers runs in the worker and reaches the host
    # model by this name. See the note on the api service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    # Opt-in kernel-enforced ceiling. `0` (the default, and what an unset
    # BIOFLOW_HARD_MEM_LIMIT resolves to) is Docker's own "no limit" value --
    # matching `docker run --memory=0` -- not a sentinel this repo invented.
    # An empty string was tried first and rejected: Compose v5's schema
    # type-checks mem_limit as a byte-size field and errors on ''. `0` is the
    # value Compose accepts that Docker already treats as unlimited, so
    # off-by-default still costs no code -- the launcher simply omits the
    # variable and this default fills in.
    #
    # If you are hand-editing .env: do not "fix" BIOFLOW_HARD_MEM_LIMIT=0 by
    # replacing it with a small positive number thinking that is a safer
    # minimum. 0 IS the correct off state, not a placeholder -- a small
    # positive value here is a real, low ceiling that will OOM-kill the
    # worker almost immediately.
    #
    # Worker only: capping `api` would put the web UI under an OOM ceiling,
    # and a user who set the limit too low would lose the interface they need
    # in order to raise it. (BIOFLOW_HARD_MEM_MB below, passed to `api`,
    # defaults to plain empty string rather than `0` -- it is not a
    # byte-size-typed field, so it has no equivalent parsing constraint.)
    mem_limit: ${BIOFLOW_HARD_MEM_LIMIT:-0}
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    healthcheck:
      # The service that actually runs jobs was the one with no healthcheck, so
      # a wedged worker reported "Up" and nothing noticed -- including the
      # launcher's health panel, which reads compose healthchecks (#878).
      #
      # Reads the file _heartbeat_loop touches each beat. See
      # app/queue/liveness.py for why a file rather than a port or a Redis key,
      # and why the staleness threshold is a multiple of the heartbeat interval
      # rather than a fixed number of seconds. The heartbeat is independent of
      # job execution, so a worker part-way through a multi-hour job stays
      # healthy; start_period covers the gap before the first beat.
      test: ["CMD", "/usr/local/bin/python3.12", "-m", "app.queue.liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    # The default 10s would SIGKILL mid-drain, stranding leases. Drain is 60s.
    stop_grace_period: 90s
    restart: unless-stopped

  web:
    image: ghcr.io/syntheticgio/bioflow-web:${BIOFLOW_TAG:-latest}
    logging: *default-logging
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
