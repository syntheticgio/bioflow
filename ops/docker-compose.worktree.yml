# Port overrides for a worktree stack. Applied by ops/worktree-up.sh on top of
# docker-compose.yml and docker-compose.override.yml, never on its own.
#
# `!override` matters here: Compose *appends* to a `ports` list when merging
# files rather than replacing it, so without the tag a worktree stack would
# publish 5173 and 8000 in addition to its own ports -- colliding with the
# main stack, which is the one thing this file exists to avoid.
# The BIND_ADDRESS prefix matches docker-compose.yml, which publishes the main
# stack on ${BIND_ADDRESS:-127.0.0.1} so a dev instance is not exposed to the
# network. Overriding `ports` here dropped that prefix, which quietly published
# every worktree stack on 0.0.0.0 -- a wider exposure than the stack it is a
# copy of, and not something a worktree should decide on its own.
#
# The port values themselves are chosen by ops/worktree-up.sh, which derives
# them from the branch slug and probes for a free pair; the defaults here are
# only a fallback for a direct `docker compose -f ...` invocation.
#
# The `.git` mounts below are what let a worktree stack answer "which revision
# am I serving?" (#452) at all. docker-compose.override.yml mounts the
# worktree's own `./.git`, which in a linked worktree is a *file* holding
# `gitdir: <absolute host path>` into the main checkout. That path does not
# exist inside the container, so the pointer dangles and the stack reports
# itself as running a published image rather than the branch it is testing --
# the exact "nothing says which code this is" gap #452 is about, arrived at
# from the worktree side. Mounting the main checkout's `.git` at the *same
# absolute path the pointer names* makes it resolve; WT_MAIN_GIT and
# WT_MAIN_GIT_PATH are exported by ops/worktree-up.sh, which knows both.
services:
  api:
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${WT_API_PORT:-8100}:8000"
    volumes:
      - ${WT_MAIN_GIT:-/dev/null}:${WT_MAIN_GIT_PATH:-/dev/null}:ro

  worker:
    volumes:
      - ${WT_MAIN_GIT:-/dev/null}:${WT_MAIN_GIT_PATH:-/dev/null}:ro

  web:
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${WT_WEB_PORT:-5273}:80"

  # docker-compose.yml bind-mounts mongo/redis to a single fixed host path
  # (~/.bioflow) for the one real installation. That path has no per-project
  # namespacing, so left alone every worktree stack would point at the exact
  # same directory as the main stack and as each other -- breaking
  # ops/worktree-up.sh's mongodump/mongorestore seeding and its
  # `compose down -v` cleanup, with real corruption risk if two mongod
  # processes ever pointed at the same WiredTiger files concurrently. These
  # overrides restore the isolated, project-namespaced named volumes that
  # worktree stacks relied on before that change. See
  # docs/superpowers/specs/2026-08-07-mongo-redis-bioflow-home-design.md.
  #
  # A worktree stack publishes no mongo/redis host ports at all. The api/web
  # ports above are remapped because a human opens those in a browser; nothing
  # opens mongo or redis from the host. Every consumer reaches them by Docker
  # DNS on the stack's own network -- MONGO_URL is `mongodb://mongo:27017`,
  # REDIS_URL is `redis://redis:6379`, worktree-up.sh seeds through
  # `docker exec ... | docker exec -i` rather than a host connection, and
  # run-worktree-tests.sh joins `biopipe_default` and dials its throwaway mongo
  # by container name.
  #
  # Left inherited, `${MONGO_PORT:-27017}` and `${REDIS_PORT:-6379}` are fixed
  # values with nothing per-project about them, so *every* worktree stack tried
  # to bind 27017 and 6379 on the host -- colliding with the main stack and with
  # each other, and failing at `docker compose up` with "port is already
  # allocated". That defeated the one thing this file exists to prevent, and it
  # made worktree stacks and the main stack mutually exclusive -- which in turn
  # broke run-worktree-tests.sh, since that script requires the main stack's
  # biopipe-api-1 to be running. Publishing a derived free port per stack would
  # also work, but not publishing is simpler and strictly safer: it removes host
  # exposure rather than widening it to two more ports per worktree.
  #
  # To reach a worktree stack's database by hand, go through the container
  # rather than the host:
  #   docker exec -it <project>-mongo-1 mongosh biopipe
  mongo:
    ports: !override []
    volumes: !override
      - mongo-data:/data/db
      - ./ops/mongo-init:/docker-entrypoint-initdb.d:ro

  redis:
    ports: !override []
    volumes: !override
      - redis-data:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  mongo-data:
  redis-data:
