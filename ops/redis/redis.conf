bind 0.0.0.0
port 6379

# Durability: the queue's dispatch state lives here. Losing it is recoverable
# (Mongo is the record of truth, see reconcile_queue) but expensive, so persist.
appendonly yes
appendfsync everysec

# NON-NEGOTIABLE: any eviction policy would silently drop queue entries under
# memory pressure, which presents as jobs vanishing with no error anywhere.
maxmemory-policy noeviction

save 900 1
save 300 10
