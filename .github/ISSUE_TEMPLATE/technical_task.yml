name: Technical task
description: Record maintenance, verification, migration, or engineering cleanup.
title: "[Maintenance]: "
labels:
  - "type: maintenance"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the maintenance, verification, migration, or cleanup need.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide measurements, logs, links, or observations that support this task.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Proposed work
      description: Describe the engineering work needed to address the task.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: List the verifiable conditions for considering this task complete.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and considerations
      description: Note compatibility, operational, migration, or rollback concerns.
    validations:
      required: false
