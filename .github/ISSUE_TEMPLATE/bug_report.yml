name: Bug report
description: Report behavior that is broken, missing, or inconsistent.
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Clear reproduction steps and safe evidence help us investigate quickly.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the broken, missing, or inconsistent behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: List the smallest set of steps that reliably shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: Describe the expected behavior or result.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include host OS, architecture, browser, and BioFlow commit or image version.
      placeholder: "macOS 15, arm64, Firefox 140, commit abc123 or image tag"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach logs, screenshots, or other evidence. Remove secrets and personally identifiable information first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed sensitive data, including secrets and personally identifiable information.
          required: true
