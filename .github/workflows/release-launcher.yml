# Builds the native launcher bundles and attaches them to a GitHub release.
# Closes the "bundles are produced by CI rather than a developer's machine"
# half of #39; see docs/macos-signing.md for the signing story this automates.
#
# Windows is not built. The launcher targets macOS and Linux only -- see the
# 2026-08-05 amendment in
# docs/superpowers/specs/2026-08-04-native-launcher-contract-design.md.
name: Release launcher

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Notarize the macOS bundle (slow; needs Apple credentials)'
        type: boolean
        default: true

# A launcher release moves real artifacts to a public download location.
# Cancelling halfway leaves a release with some platforms attached and not
# others, which is worse than waiting.
concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-guard:
    name: Tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ops/check_tag_matches_version.sh "${{ github.ref_name }}"

  # The build itself lives in launcher-build.yml, a reusable workflow shared
  # with release.yml's combined-release path (#335): two copies of a signing
  # and notarization sequence drift the first time the certificate story
  # changes, and that sequence is the fiddliest thing in this repo's CI.
  bundles:
    name: Build bundles
    needs: [version-guard]
    uses: ./.github/workflows/launcher-build.yml
    permissions:
      contents: read
    with:
      notarize: ${{ inputs.notarize != false }}
      apple_team_id: ${{ vars.APPLE_TEAM_ID }}
    secrets:
      CI_SIGNING_P12_BASE64: ${{ secrets.CI_SIGNING_P12_BASE64 }}
      CI_SIGNING_P12_PASSWORD: ${{ secrets.CI_SIGNING_P12_PASSWORD }}
      CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  release:
    name: Attach bundles to the release
    needs: [bundles]
    # Only a tag push publishes. A manual workflow_dispatch run builds and
    # leaves the artifacts on the run, which is what makes it usable as a
    # "does this still build" check without creating a release.
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The linux artifact preserves its bundle/deb, bundle/rpm subpaths
          # under bundles/ (merge-multiple flattens artifact *names*, not the
          # directory structure inside each one), while the macOS .dmg lands
          # flat. A `bundles/*` glob therefore includes the deb/ and rpm/
          # directories themselves, and `gh release create` fails trying to
          # upload a directory as a release asset. Find actual files instead.
          find bundles -type f -print
          mapfile -t assets < <(find bundles -type f)
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "BioFlow Launcher ${TAG#launcher-v}" \
            --generate-notes \
            "${assets[@]}" \
            || gh release upload "$TAG" --repo "${{ github.repository }}" "${assets[@]}" --clobber
