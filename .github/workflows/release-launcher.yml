# Builds the native launcher bundles and attaches them to a GitHub release.
# Closes the "bundles are produced by CI rather than a developer's machine"
# half of #39; see docs/macos-signing.md for the signing story this automates.
#
# Windows is not built. The launcher targets macOS and Linux only -- see the
# 2026-08-05 amendment in
# docs/superpowers/specs/2026-08-04-native-launcher-contract-design.md.
name: Release launcher

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Notarize the macOS bundle (slow; needs Apple credentials)'
        type: boolean
        default: true

# A launcher release moves real artifacts to a public download location.
# Cancelling halfway leaves a release with some platforms attached and not
# others, which is worse than waiting.
concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Both jobs run on self-hosted runners: this repo has no GitHub-hosted ones.
  # See docs/ci-runners.md -- the repo is private under a personal account, so
  # hosted macOS and arm64 Linux runners are not on the plan.
  macos:
    name: macOS bundle (arm64)
    # The same Apple Silicon machine that builds linux/arm64 images in
    # publish-images.yml. Crucially it is also the machine that holds the
    # Developer ID certificate in its login keychain -- so unlike a hosted
    # runner, there is no need to ship a base64 .p12 through a secret and
    # import it into a temporary keychain. The tradeoff is that the signing
    # key lives on a dev machine rather than in GitHub's secret store; for a
    # single-maintainer project that is the simpler and less leaky option.
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the signing identity is present
        # Fail in five seconds rather than after the full release build. The
        # certificate expires yearly, and the failure mode when it lapses is a
        # build that succeeds and produces an unsignable bundle.
        run: |
          set -euo pipefail
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in the runner keychain."
            exit 1
          fi
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Install frontend dependencies
        working-directory: launcher
        run: npm ci

      - name: Build, sign, and notarize
        working-directory: launcher
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ vars.APPLE_KEYCHAIN_PROFILE || 'bioflow' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.notarize == false }}" = "true" ]; then
            ./build-macos.sh --no-notarize
          else
            ./build-macos.sh
          fi

      - name: Confirm the bundle is actually notarized
        # The build script prints spctl output but does not fail on it, so the
        # gate lives here. `codesign --verify` passing is not evidence of
        # notarization -- a signed, un-notarized DMG passes it and is still
        # blocked on every machine that downloads it.
        if: ${{ inputs.notarize != false }}
        working-directory: launcher
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -maxdepth 1 | head -n1)"
          [ -n "$dmg" ] || { echo "::error::No .dmg was produced"; exit 1; }
          if ! spctl -a -vvv -t install "$dmg" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"; then
            echo "::error::${dmg} is not notarized -- a download of it will be blocked by Gatekeeper."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-arm64
          path: launcher/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux bundle (amd64)
    runs-on: [self-hosted, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # Tauri v2 needs the -dev packages, not just the runtime libraries --
        # see launcher/README.md. Kept idempotent so a warm runner skips fast.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential

      - name: Install frontend dependencies
        working-directory: launcher
        run: npm ci

      - name: Build
        # tauri.linux.conf.json restricts targets to deb and rpm; AppImage
        # bundling hangs on any machine with AppImageLauncher installed. That
        # overlay is auto-merged, so no --config flag is needed here.
        working-directory: launcher
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-amd64
          path: |
            launcher/src-tauri/target/release/bundle/deb/*.deb
            launcher/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Attach bundles to the release
    needs: [macos, linux]
    # Only a tag push publishes. A manual workflow_dispatch run builds and
    # leaves the artifacts on the run, which is what makes it usable as a
    # "does this still build" check without creating a release.
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: [self-hosted, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la bundles/
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "BioFlow Launcher ${TAG#launcher-v}" \
            --generate-notes \
            bundles/* \
            || gh release upload "$TAG" --repo "${{ github.repository }}" bundles/* --clobber
