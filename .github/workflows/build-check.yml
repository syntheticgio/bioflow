# Verifies code quality and build integrity on every PR into main.
#
# Three jobs:
#   frontend-check — lint + unit tests + prod image build (ubuntu-latest)
#   backend-smoke  — ruff + import smoke test + ops script tests (self-hosted)
#   backend-full   — full pytest suite with Mongo service (commented out;
#                    enable when switching to hosted runners — see below)
#
# Frontend only builds on PRs today, not full backend Docker images:
# the backend image compiles bwa-mem2, Clair3, and compleasm from source
# and is expensive even with a warm BuildKit cache. The backend is instead
# smoke-tested here (ruff + import + ops tests); the full pytest suite is
# deferred until a Mongo replica-set service can be provisioned on
# GitHub-hosted runners — see the commented-out job at the bottom.

name: Build check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip the frontend check job'
        type: boolean
        default: false
      skip_backend:
        description: 'Skip the backend smoke test job'
        type: boolean
        default: false

# A new push to the same PR supersedes the in-flight check for the old one.
concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend (lint + test + build)
    if: ${{ !inputs.skip_frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (tsc --noEmit)
        working-directory: frontend
        run: npm run lint

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      # No push, no registry login: this only needs to prove the image
      # builds. `npm run build` runs inside the `build` stage that `prod`
      # depends on, so a Vite/esbuild syntax error fails this step exactly
      # the way it fails `docker compose up -d --build` locally.
      - name: Build prod image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-smoke:
    name: Backend smoke (ruff + import + ops tests)
    if: ${{ !inputs.skip_backend }}
    # Self-hosted X64 runner — see docs/ci-runners.md for why self-hosted is
    # used for this repo (private personal account; no arm64 Linux or macOS
    # hosted runners available).
    #
    # To switch to GitHub-hosted runners: change runs-on to `ubuntu-latest`
    # and add an "Install build dependencies" step (build-essential, zlib,
    # etc.) before `pip install` — pysam and cryptography need C/toolchain
    # headers that the self-hosted runner already has from building the
    # backend Docker image.
    runs-on: [self-hosted, X64]
    # runs-on: ubuntu-latest  # ← flip this line when ready to switch
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      # Ruff is a standalone binary (no dependencies of its own), so install
      # it first — this gives fast lint feedback before the heavier backend
      # install step runs.
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check backend/app

      - name: Install backend dev dependencies
        run: pip install -e 'backend/.[dev]'

      # Exercises the full import chain (every router, service, and the MCP
      # server module) without connecting to Mongo or Redis — create_app()
      # only wires up routes; lifespan (which connects to DBs) runs later.
      - name: Import smoke test
        run: python -c "import app.main; print('backend imports OK')"

      # The ops tests are self-contained (subprocess + tmp_path fixtures,
      # no backend imports) and validate the release-version guard and
      # version-bump scripts that publish-images.yml and release-launcher.yml
      # depend on.
      - name: Ops script tests
        run: pytest ops/tests/ -v

  # ------------------------------------------------------------------
  # FUTURE: Full backend test suite with Mongo replica-set service.
  #
  # Enable when switching to ubuntu-latest (GitHub-hosted runners).
  # The smoke test above covers ruff + imports; this job adds the
  # full pytest suite (312 test files) that need a real Mongo replica set
  # — the conftest.py hardcodes database "biopipe_test" and the
  # beanie_models fixture (scope="module") drops all collections on entry.
  #
  # Run order: install deps → init replica set → pytest.
