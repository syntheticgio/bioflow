# Verifies code quality and build integrity on every PR into main or into a
# release-stage branch (alpha/**, beta/**, release/**).
#
# Five jobs:
#   changes            — detects whether the PR touches anything besides
#                         Markdown/LICENSE; gates the other four
#   frontend-check     — lint + unit tests + prod image build (ubuntu-latest)
#   launcher-check     — unit tests + the tsc/vite build tauri runs (ubuntu-latest)
#   backend-smoke      — bug-only ruff lint + import smoke test + ops script tests
#   backend-full-test  — full pytest suite with Mongo replica-set service
#
# Backend Docker images are NOT built on PRs: they compile bwa-mem2, Clair3,
# and compleasm from source and are expensive. The backend is instead
# smoke-tested here (bug lint + import + ops tests). The full pytest suite runs
# as a separate job with a Mongo replica-set container.
#
# The four downstream jobs are each required checks in the branch ruleset, so
# they must report *something* on every PR -- a workflow-level `paths-ignore`
# used to skip them entirely on docs-only PRs, which leaves the check
# "absent" rather than "success" or "skipped", and a ruleset waiting on an
# absent check blocks forever (#732). Each job runs unconditionally now and
# early-exits with a quick success when `changes` finds nothing but
# Markdown/LICENSE, so the required name always reports.

name: Build check

# Release-stage branches are included deliberately (#818). Fixes found during
# alpha go in by PR *into* alpha/X.Y.Z, and beta takes bug fixes the same way
# (see the release methodology in CLAUDE.md) -- so those PRs land on the branch
# that is about to be tagged and shipped. Gated on `main` alone they ran only
# cla-check: no build, no tests, no commit validation, on the code closest to
# release. The branch names are the ones ops/release.sh creates.
on:
  pull_request:
    branches:
      - main
      - 'alpha/**'
      - 'beta/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip the frontend check job'
        type: boolean
        default: false
      skip_backend:
        description: 'Skip the backend smoke test job'
        type: boolean
        default: false
      skip_launcher:
        description: 'Skip the launcher check job'
        type: boolean
        default: false
      skip_backend_full:
        description: 'Skip the full backend test suite job'
        type: boolean
        default: false

# A new push to the same PR supersedes the in-flight check for the old one.
concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs unconditionally (unlike the four jobs below, an `if:`-skipped job
  # is also "absent" to the ruleset, but nothing requires this one) and
  # decides whether this PR touches anything besides Markdown/LICENSE.
  # `dorny/paths-filter` diffs against the PR's merge base without a full
  # checkout, so this finishes in seconds ahead of the real jobs.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.code == 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!(**/*.md|**/*.mdx|LICENSE)'

  frontend-check:
    name: Frontend (lint + test + build)
    needs: changes
    if: ${{ !inputs.skip_frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip -- docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Docs-only PR (see issue 732); nothing for this job to check.'

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Setup Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint (tsc --noEmit)
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test (vitest)
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: frontend
        run: npm run test

      # No push, no registry login: this only needs to prove the image
      # builds. `npm run build` runs inside the `build` stage that `prod`
      # depends on, so a Vite/esbuild syntax error fails this step exactly
      # the way it fails `docker compose up -d --build` locally.
      # setup-buildx-action is required for the GHA cache backend (type=gha)
      # — without it, build-push-action falls back to the default `docker`
      # driver which can't export the cache.
      - name: Setup Docker Buildx
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build prod image
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  launcher-check:
    name: Launcher (test + build)
    needs: changes
    if: ${{ !inputs.skip_launcher }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip -- docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Docs-only PR (see issue 732); nothing for this job to check.'

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Setup Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: launcher/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: launcher
        run: npm ci

      - name: Test (vitest)
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: launcher
        run: npm run test

      # This runs `tsc -b && vite build` -- the same command tauri invokes as
      # its beforeBuildCommand, and deliberately not `npm run lint`
      # (`tsc --noEmit`), which is a different compiler mode. The Rust side is
      # not built here: it is slow, needs platform toolchains, and the failure
      # this job exists to catch happens before cargo is ever reached.
      #
      # v0.5.0's macOS and Linux bundles both failed on a test file missing its
      # `import { describe, expect, it } from "vitest"`. Vitest injects those
      # globals at runtime so `npm run test` passed, but tsconfig has
      # `include: ["src"]` and no vitest global types, so `tsc` failed -- and
      # nothing in the PR path compiled the launcher at all.
      - name: Build (tsc -b && vite build)
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: launcher
        run: npm run build

  backend-smoke:
    name: Backend smoke (import + ops tests)
    needs: changes
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-latest
    # Default (no timeout-minutes) is GitHub's 360-minute hard cap. A stalled
    # apt-get mirror in "Install system build dependencies" has hung this job
    # for over an hour with nothing to fail it (#577) — 15 min gives a real
    # margin over the ~2-3 min this job normally takes end to end.
    #
    # This is the outer backstop, not the first line of defence: both apt-get
    # steps below bound their own fetches (see the note on the first one), so
    # a dead mirror should fail in about a minute rather than burning the
    # full 15. If this timeout is what ends a run, the apt options did not
    # catch it and the stall is something else.
    timeout-minutes: 15
    # Same prebuilt image as backend-full-test. It already ships
    # build-essential and zlib1g-dev (the two packages the removed apt step
    # installed) plus shellcheck, so this job now starts at checkout instead
    # of at an apt mirror -- the stall #577 documents.
    container:
      image: ghcr.io/syntheticgio/bioflow-ci-runner:latest
    steps:
      - name: Skip -- docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Docs-only PR (see issue 732); nothing for this job to check.'

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Trust the workspace
        if: needs.changes.outputs.docs_only != 'true'
        # The checkout is owned by the runner's uid while the job container
        # runs as root, so git refuses it: "detected dubious ownership in
        # repository". ops/tests/test_release_preflight.py shells out to git
        # for real and fails on that, three tests' worth. Only an issue since
        # these jobs moved into a container -- on a bare runner the uids match.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Bug-only lint. Ruff was removed from CI on 2026-08-19 because E501
      # and import-order failed PRs on trivia (#32ea08f2); this deliberately
      # does NOT restore that. --select is narrowed to the two rules that are
      # always real bugs, so a long line or a mis-ordered import cannot go
      # red here -- only the pre-commit hook reports those.
      #
      #   F821  undefined name -- a live NameError. Shipped for real in
      #         suggestion_service (SidecarRole), raising on every Actions-tab
      #         evaluation of the SV-merge card.
      #   F401  unused import -- the residue of a half-finished edit, and the
      #         error that sat on main for 13 commits after a rebase replayed
      #         them without running the hook.
      #
      # Syntax errors fail this step regardless of --select and need no rule
      # of their own (E999 was removed from ruff and cannot be selected).
      #
      # --config is explicit: backend/pyproject.toml only auto-applies under
      # backend/, so ops/ and e2e/ would silently fall back to ruff's own
      # defaults (#466). --output-format=concise keeps a failure to one line
      # per finding.
      - name: Lint for bugs with ruff (F821, F401)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          pip install ruff
          ruff check --config backend/pyproject.toml \
                     --select F821,F401 \
                     --output-format=concise \
                     backend/app backend/tests ops e2e

      - name: Install backend dev dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -e 'backend/.[dev]'

      # Exercises the full import chain (every router, service, and the MCP
      # server module) without connecting to Mongo or Redis — create_app()
      # only wires up routes; lifespan (which connects to DBs) runs later.
      - name: Import smoke test
        if: needs.changes.outputs.docs_only != 'true'
        run: python -c "import app.main; print('backend imports OK')"

      # The ops tests are self-contained (subprocess + tmp_path fixtures,
      # no backend imports) and validate the release-version guard and
      # version-bump scripts that release.yml and release-launcher.yml
      # depend on.
      - name: Ensure npm
        if: needs.changes.outputs.docs_only != 'true'
        # ops/tests/test_release_preflight.py drives release.sh for real, and
        # it bumps the launcher's package.json with `npm version`. A GitHub
        # runner ships npm; this container did not until 2026-08-19, and
        # ci-runner.yml only rebuilds the image on push to main -- so install
        # it here when absent. A no-op once the rebuilt image is published.
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm absent from the image; installing"
            apt-get update -qq
            apt-get install -y --no-install-recommends npm
          fi
          npm --version

      - name: Ops script tests
        if: needs.changes.outputs.docs_only != 'true'
        run: pytest ops/tests/ -v

      # Static analysis of the shell scripts, added in #492. Worth stating
      # what this does NOT do: it does not catch the locale-dependent
      # unbraced-expansion bug that issue was filed about. shellcheck reports
      # `log "$dir…"` clean, because it is valid syntax whose meaning depends
      # on the runtime LC_CTYPE. The tests in ops/tests/test_backup_restore.py
      # are what cover that. This step guards a different class -- quoting,
      # globbing, unused variables -- and the tree was already clean when it
      # was added, so a failure here is a regression, not a backlog.
      - name: Lint shell scripts with shellcheck
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # shellcheck comes from the CI image; the apt-get that used to
          # install it here is gone along with the mirror stall it risked
          # (#577).
          #
          # ops/hooks/commit-msg is named explicitly: it is a bash script
          # with no extension, so a *.sh glob skips it silently.
          shellcheck ops/*.sh ops/hooks/*.sh ops/hooks/commit-msg

  backend-full-test:
    name: Backend tests (full pytest suite)
    needs: changes
    if: ${{ !inputs.skip_backend_full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs inside the prebuilt CI image rather than installing its toolchain
    # on a bare runner. `.github/Dockerfile.ci` was built for exactly this
    # (see ci-runner.yml) and ships minimap2, samtools, tabix/bgzip, flye,
    # fastp, bcftools, bowtie2, hisat2, the NCBI datasets CLI and bwa-mem2 --
    # the same set the removed apt/curl steps used to fetch on every run.
    # Those steps regularly took the bulk of the job's 20-minute budget and
    # were its main source of flakiness (apt mirror stalls, #577).
    #
    # The image ships no Python packages, so the dev extras are still
    # installed below; that step is cached and fast.
    container:
      image: ghcr.io/syntheticgio/bioflow-ci-runner:latest
      # The Docker socket, so the Mongo replica set below can still be started
      # with `docker run`. GitHub's `services:` cannot express it: a service
      # container takes no `command:`, and `options` cannot set CMD, so there
      # is no way to pass mongod the --replSet flag transactions require.
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Skip -- docs-only PR
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Docs-only PR (see issue 732); nothing for this job to check.'

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Trust the workspace
        if: needs.changes.outputs.docs_only != 'true'
        # The checkout is owned by the runner's uid while the job container
        # runs as root, so git refuses it: "detected dubious ownership in
        # repository". ops/tests/test_release_preflight.py shells out to git
        # for real and fails on that, three tests' worth. Only an issue since
        # these jobs moved into a container -- on a bare runner the uids match.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install backend dev dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -e 'backend/.[dev]'

      - name: Verify the data home
        if: needs.changes.outputs.docs_only != 'true'
        # `.github/Dockerfile.ci` already lays /data out with the
        # .biopipe/VERSION sentinel require_home() checks before every write
        # path, so this asserts rather than creates -- if a future image drops
        # it, this fails with one clear line instead of dozens of
        # StorageUnavailableError test failures.
        run: |
          test -f /data/.biopipe/VERSION || {
            echo "::error::/data/.biopipe/VERSION missing from the CI image"
            exit 1
          }
          chmod -R 777 /data
          echo "data home OK: $(cat /data/.biopipe/VERSION)"

      - name: Ensure a Docker client
        if: needs.changes.outputs.docs_only != 'true'
        # The image gained `docker-cli` on 2026-08-19, but ci-runner.yml only
        # rebuilds it on push to main -- so a PR that needs the client before
        # that rebuild lands would fail with "docker: command not found".
        # Once the rebuilt image is published this is a no-op that prints the
        # version and exits.
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker client absent from the image; installing"
            apt-get update -qq
            apt-get install -y --no-install-recommends docker-cli
          fi
          docker --version

      - name: Start MongoDB with a replica set
        if: needs.changes.outputs.docs_only != 'true'
        # `docker run` against the mounted socket, so this is a *sibling* of
        # the job container, not a child. Sibling containers do not share
        # localhost, so the set is initiated and addressed by container name
        # on a network the job container joins below.
        run: |
          docker network create biopipe-ci 2>/dev/null || true
          docker run -d --name mongo --network biopipe-ci \
            mongo:7 --replSet rs0 --bind_ip_all
          # Join this job's own container to that network so `mongo:27017`
          # resolves from the test process.
          docker network connect biopipe-ci "$(cat /etc/hostname)"
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then
              echo "mongod is accepting connections"
              break
            fi
            sleep 1
          done
          # Initiate, then wait for the election -- initiate returns before a
          # primary exists, and a write in that window fails NotWritablePrimary.
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})' || true
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "replica set is primary"
              break
            fi
            sleep 1
          done

      - name: Run full test suite
        if: needs.changes.outputs.docs_only != 'true'
        # Parallel, which is what this workflow's own PR (#679/#693) made
        # safe: every worker gets its own Mongo database, so xdist workers
        # cannot truncate each other's data. `--dist loadgroup` is required,
        # not optional -- test_object_deletion is pinned to one worker with
        # an xdist_group mark and scatters without it.
        #
        # Heavy-marked tests run afterwards, sequentially, with nothing else
        # alive. The marker is currently empty, so that phase collects
        # nothing and exits 5; `|| [ $? -eq 5 ]` is what keeps that green.
        run: |
          # Workers from the runner's real core count, not `-n auto`. Inside a
          # container `os.cpu_count()` reports the *host's* cores and ignores
          # the cgroup quota, so `auto` oversubscribes badly: measured at a
          # 4-CPU cap, `auto` spawned 24 workers and took 136s where `-n 4`
          # took 67s. nproc reads the same unaware count, so the quota is read
          # from the cgroup directly, with nproc as the fallback for a runner
          # that is not cgroup-limited.
          quota=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null | awk '{if ($1 != "max" && $2 > 0) print int($1/$2)}')
          workers="${quota:-$(nproc)}"
          [ "${workers:-0}" -ge 1 ] || workers=2
          echo "running with $workers workers"
          pytest backend/tests/ -q --tb=no -m "not heavy" -n "$workers" --dist loadgroup
          pytest backend/tests/ -q --tb=no -m heavy || [ $? -eq 5 ]
        env:
          MONGO_URL: "mongodb://mongo:27017/biopipe_test?replicaSet=rs0&directConnection=true"
