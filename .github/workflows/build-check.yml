# Verifies code quality and build integrity on every PR into main.
#
# Four jobs:
#   frontend-check    — lint + unit tests + prod image build (ubuntu-latest)
#   launcher-check    — unit tests + the tsc/vite build tauri runs (ubuntu-latest)
#   backend-smoke     — ruff + import smoke test + ops script tests
#   backend-full-test — full pytest suite against a Mongo replica set (#601)
#
# Backend Docker images are NOT built on PRs: they compile bwa-mem2, Clair3,
# and compleasm from source and are expensive. backend-full-test does not need
# them: the suite runs against pip-installed deps, fakes Redis with fakeredis,
# and the only tool-dependent tests are gated behind BIOFLOW_TEST_LIVE_DATA.

name: Build check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip the frontend check job'
        type: boolean
        default: false
      skip_backend:
        description: 'Skip the backend smoke test job'
        type: boolean
        default: false
      skip_launcher:
        description: 'Skip the launcher check job'
        type: boolean
        default: false

# A new push to the same PR supersedes the in-flight check for the old one.
concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend (lint + test + build)
    if: ${{ !inputs.skip_frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (tsc --noEmit)
        working-directory: frontend
        run: npm run lint

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      # No push, no registry login: this only needs to prove the image
      # builds. `npm run build` runs inside the `build` stage that `prod`
      # depends on, so a Vite/esbuild syntax error fails this step exactly
      # the way it fails `docker compose up -d --build` locally.
      # setup-buildx-action is required for the GHA cache backend (type=gha)
      # — without it, build-push-action falls back to the default `docker`
      # driver which can't export the cache.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build prod image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  launcher-check:
    name: Launcher (test + build)
    if: ${{ !inputs.skip_launcher }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: launcher/package-lock.json

      - name: Install dependencies
        working-directory: launcher
        run: npm ci

      - name: Test (vitest)
        working-directory: launcher
        run: npm run test

      # This runs `tsc -b && vite build` -- the same command tauri invokes as
      # its beforeBuildCommand, and deliberately not `npm run lint`
      # (`tsc --noEmit`), which is a different compiler mode. The Rust side is
      # not built here: it is slow, needs platform toolchains, and the failure
      # this job exists to catch happens before cargo is ever reached.
      #
      # v0.5.0's macOS and Linux bundles both failed on a test file missing its
      # `import { describe, expect, it } from "vitest"`. Vitest injects those
      # globals at runtime so `npm run test` passed, but tsconfig has
      # `include: ["src"]` and no vitest global types, so `tsc` failed -- and
      # nothing in the PR path compiled the launcher at all.
      - name: Build (tsc -b && vite build)
        working-directory: launcher
        run: npm run build

  backend-smoke:
    name: Backend smoke (ruff + import + ops tests)
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-latest
    # Default (no timeout-minutes) is GitHub's 360-minute hard cap. A stalled
    # apt-get mirror in "Install system build dependencies" has hung this job
    # for over an hour with nothing to fail it (#494) — 15 min gives a real
    # margin over the ~2-3 min this job normally takes end to end.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      # pysam (C extension against htslib) and cryptography (Rust) need
      # toolchain headers that aren't in the base ubuntu-latest image.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      # Ruff is a standalone binary (no dependencies of its own), so install
      # it first — this gives fast lint feedback before the heavier backend
      # install step runs.
      #
      # --config is explicit rather than relied on for auto-discovery:
      # backend/pyproject.toml only auto-applies to paths under backend/, so
      # ops/ and e2e/ would otherwise silently fall back to ruff's own
      # built-in defaults -- a different, smaller rule set (see #466).
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check --config backend/pyproject.toml backend/app backend/tests ops e2e

      - name: Install backend dev dependencies
        run: pip install -e 'backend/.[dev]'

      # Exercises the full import chain (every router, service, and the MCP
      # server module) without connecting to Mongo or Redis — create_app()
      # only wires up routes; lifespan (which connects to DBs) runs later.
      - name: Import smoke test
        run: python -c "import app.main; print('backend imports OK')"

      # The ops tests are self-contained (subprocess + tmp_path fixtures,
      # no backend imports) and validate the release-version guard and
      # version-bump scripts that release.yml and release-launcher.yml
      # depend on.
      - name: Ops script tests
        run: pytest ops/tests/ -v

      # Static analysis of the shell scripts, added in #492. Worth stating
      # what this does NOT do: it does not catch the locale-dependent
      # unbraced-expansion bug that issue was filed about. shellcheck reports
      # `log "$dir…"` clean, because it is valid syntax whose meaning depends
      # on the runtime LC_CTYPE. The tests in ops/tests/test_backup_restore.py
      # are what cover that. This step guards a different class -- quoting,
      # globbing, unused variables -- and the tree was already clean when it
      # was added, so a failure here is a regression, not a backlog.
      - name: Lint shell scripts with shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # ops/hooks/commit-msg is named explicitly: it is a bash script
          # with no extension, so a *.sh glob skips it silently.
          shellcheck ops/*.sh ops/hooks/*.sh ops/hooks/commit-msg

  # Full pytest suite (#601). The smoke test above covers ruff + imports;
  # this runs everything else — ~5,700 tests, ~5.5 min measured locally.
  #
  # No Redis service and no REDIS_URL: the suite fakes Redis end to end
  # (fakeredis.aioredis, wired up in tests/queue/conftest.py and elsewhere),
  # and the queue tests run the real Lua scripts against the fake. A REDIS_URL
  # here would only invite debugging a connection that is never made.
  backend-full-test:
    name: Backend tests (full pytest suite)
    if: ${{ !inputs.skip_backend }}
    runs-on: ubuntu-latest
    # ~5.5 min for the suite plus ~3 min of setup; same stalled-apt-mirror
    # margin reasoning as backend-smoke (#494).
    timeout-minutes: 20
    services:
      # A single-node replica set is required for MongoDB transactions
      # (blob refcount updates, share cascades) — conftest.py hardcodes the
      # "biopipe_test" database and the URL must name replicaSet=rs0.
      #
      # Deliberately no MONGO_INITDB_ROOT_USERNAME/PASSWORD: mongod refuses
      # to start with auth + --replSet and no keyfile, and a throwaway CI
      # container has nothing to protect. Same pattern as the throwaway
      # Mongo in backend/run-worktree-tests.sh.
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: --replSet rs0 --bind_ip_all
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      # Same toolchain headers backend-smoke needs for pysam/cryptography.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Install backend dev dependencies
        run: pip install -e 'backend/.[dev]'

      # The mongo:7 image ships mongosh, so the replica set is initiated by
      # exec-ing into the service container rather than installing a shell on
      # the runner. The loop covers both mongod not accepting connections yet
      # and the window between rs.initiate() and the node electing itself
      # primary — rs.status().ok only reports 1 once the set is usable.
      - name: Initialize replica set
        run: |
          until docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval \
                'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok }' \
                2>/dev/null | grep -q 1; do
            sleep 1
          done

      - name: Run full test suite
        run: pytest backend/tests/ -q
        env:
          MONGO_URL: "mongodb://localhost:27017/biopipe_test?replicaSet=rs0&directConnection=true"
