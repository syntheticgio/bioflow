# Marks issues fixed on a release-stage branch, and unmarks them when they close.
#
# GitHub's `Closes #NN` auto-close only fires on the default branch, and that
# is not configurable -- there is no repo setting or branch-protection option
# that extends it to other branches. It is also the right default for this
# repo: an alpha or beta can be recut or abandoned, so a fix landing there is
# genuinely not delivered yet (CLAUDE.md: "Landing on `main` is not shipping").
#
# What was missing was not early closing but *visibility*. Merging beta/0.6.0
# back to main in #936 closed thirteen issues at once, every one of which had
# sat open for weeks with nothing on it saying the work was already done.
#
# So: label on the release-branch merge, let the backflow merge into main do
# the actual closing. The label is deliberately transient -- it means "fixed,
# awaiting backflow" and nothing else, so the unlabel job removes it the
# moment the issue closes and the closed state carries the meaning instead.
name: Release-branch fixes

on:
  pull_request_target:
    types: [closed]
    branches: ["alpha/**", "beta/**", "release/**"]
  issues:
    types: [closed]

# Both jobs only ever label, unlabel and comment. `contents` stays unset
# (defaulting to none) because neither reads the tree: the labelling job
# parses the PR body from the event payload, never a checkout. This matters
# for `pull_request_target`, which runs with a writable token in the base
# repo's context -- with no checkout step and no code execution, a fork PR
# cannot reach that token.
permissions:
  issues: write

jobs:
  label:
    name: Label issues fixed on a release branch
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Label each issue the PR closes
        uses: actions/github-script@v9
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const LABEL = 'status:fixed-in-release-branch'
            const branch = context.payload.pull_request.base.ref
            const prNumber = context.payload.pull_request.number

            // The same keyword set GitHub itself honours, so an issue that
            // would have been closed by a merge to main gets labelled here
            // instead -- no third spelling for a maintainer to remember.
            // Every group non-capturing but the issue number: an optional
            // capturing suffix group makes m[1] the suffix ("es") instead
            // of the digits, which reads fine and matches nothing useful.
            const KEYWORDS = 'close[sd]?|fix(?:e[sd])?|resolve[sd]?'
            const pattern = new RegExp(`\\b(?:${KEYWORDS})\\s+#(\\d+)\\b`, 'gi')

            const body = process.env.PR_BODY || ''
            const issues = [...new Set(
              [...body.matchAll(pattern)].map(m => Number(m[1]))
            )]

            if (issues.length === 0) {
              core.info(`PR #${prNumber} closes no issues by keyword; nothing to label.`)
              return
            }

            for (const issue_number of issues) {
              // A PR body can reference a pull request by number just as
              // easily as an issue, and `GET /issues/{n}` answers for both.
              // Labelling a PR would be harmless but confusing, so skip it.
              let target
              try {
                const { data } = await github.rest.issues.get({
                  ...context.repo, issue_number,
                })
                target = data
              } catch (err) {
                // A reference to a deleted or cross-repo issue should not
                // fail the run: the merge already happened and this job is
                // bookkeeping on top of it.
                core.warning(`Could not read #${issue_number}: ${err.message}`)
                continue
              }

              if (target.pull_request) {
                core.info(`#${issue_number} is a pull request, not an issue; skipping.`)
                continue
              }
              if (target.state === 'closed') {
                core.info(`#${issue_number} is already closed; skipping.`)
                continue
              }
              if (target.labels.some(l => (l.name || l) === LABEL)) {
                core.info(`#${issue_number} already labelled; skipping.`)
                continue
              }

              await github.rest.issues.addLabels({
                ...context.repo, issue_number, labels: [LABEL],
              })
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body:
                  `Fixed on \`${branch}\` in #${prNumber}.\n\n` +
                  `This stays open until \`${branch}\` merges back into ` +
                  `\`main\` -- that merge closes it. Until then the ` +
                  `\`${LABEL}\` label means the work is done but not yet on ` +
                  `the trunk.`,
              })
              core.info(`Labelled #${issue_number} (fixed on ${branch}).`)
            }

  unlabel:
    name: Drop the label once the issue closes
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the label if present
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'status:fixed-in-release-branch'
            const issue_number = context.payload.issue.number

            const labelled = (context.payload.issue.labels || [])
              .some(l => (l.name || l) === LABEL)
            if (!labelled) return

            try {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number, name: LABEL,
              })
              core.info(`Removed ${LABEL} from #${issue_number}.`)
            } catch (err) {
              // 404 means something else removed it between the event
              // firing and this call -- the desired end state either way.
              if (err.status !== 404) throw err
            }
