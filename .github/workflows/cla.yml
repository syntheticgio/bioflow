# Gates PRs on CLA agreement so external contributions can be relicensed
# later without having to track down every past contributor individually.
# See CONTRIBUTING.md for what the CLA says and why it exists.
#
# contributor-assistant/github-action, not the old cla-assistant/cla-assistant:
# the latter needs its own hosted server, this one just commits signatures to
# a JSON file in this repo. Signing happens by commenting "I have read the CLA
# Document and I hereby sign the CLA" on the PR when the bot asks.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.CLA_ASSISTANT_TOKEN }}  # Use PAT instead of GITHUB_TOKEN
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md
          # Must stay set. The action's default is `master`, which this repo
          # does not have -- its default branch is `main` -- so leaving this
          # commented out fails every PR with "Branch master not found. Make
          # sure the branch where signatures are stored is NOT protected."
          # The misleading half of that message is the protection hint: the
          # branch is unprotected, it simply does not exist under that name.
          branch: cla-signatures
          # Signatures live on their own branch rather than on `main` so the
          # bot's commits don't land in the release notes or the changelog.
          #
          # `claude` is here because agent commits in this repo carry a
          # `Co-Authored-By: Claude ...` trailer, which makes the bot a
          # committer the action then demands a signature from -- and a bot
          # account can never post the sign-off comment, so the check can
          # never pass. Allowlisting bots is the documented remedy for
          # exactly this.
          allowlist: syntheticgio,claude,bot*
          # remote-organization-name: ${{ github.repository_owner }}
          # remote-repository-name: ${{ github.event.repository.name }}
