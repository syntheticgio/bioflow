server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths resolve to the app so client-side routes survive reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE (/api/v1/events) must not be buffered or timed out.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        # Large uploads stream straight through.
        client_max_body_size 0;
        proxy_request_buffering off;
    }
}
