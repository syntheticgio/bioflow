<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1080" class="viz" role="img">
<style>/* 04-analysis-lattice */
  .viz { --surface:#fcfcfb; --panel:#f4f2ee; --lane:#efece6;
         --ink:#0b0b0b; --ink2:#52514e; --ink3:#7d7a73; --rule:#ddd9d1;
         --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a;
         --gray:#6b6862; --red:#e34948; --green:#008300;
         --blue-f:#e8f1fc; --orange-f:#fdeee7; --aqua-f:#e4f6ef;
         --gray-f:#f0efec; --red-f:#fceceb; --green-f:#e8f3e8; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --panel:#232320; --lane:#26261f;
           --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f887d; --rule:#39382f;
           --blue:#3987e5; --orange:#d95926; --aqua:#199e70;
           --gray:#9c968b; --red:#e66767; --green:#3fa03f;
           --blue-f:#152232; --orange-f:#2b1d16; --aqua-f:#122622;
           --gray-f:#26251f; --red-f:#2c1c1b; --green-f:#16240f; }
  }
  .viz text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .t-title { font-size:23px; font-weight:650; fill:var(--ink); letter-spacing:-.2px }
  .t-sub   { font-size:13px; fill:var(--ink2) }
  .t-lane  { font-size:12px; font-weight:750; letter-spacing:.09em; text-transform:uppercase }
  .t-lane2 { font-size:10.5px; fill:var(--ink3) }
  .t-node  { font-size:12.5px; font-weight:640; fill:var(--ink) }
  .t-tool  { font-size:10.5px; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:var(--ink2) }
  .t-edge  { font-size:10px; font-weight:620; fill:var(--ink2) }
  .t-note  { font-size:11px; fill:var(--ink2) }
  .t-phase { font-size:9.5px; font-weight:750; letter-spacing:.08em; fill:var(--ink3) }
  .t-key   { font-size:11.5px; fill:var(--ink2) }
</style>
<defs><marker id="arred" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--red)"/></marker></defs><rect width="1760" height="1080" fill="var(--surface)"/><text x="34.0" y="44.0" class="t-title" text-anchor="start">4 · The analysis ladder is a lattice, not a staircase</text><text x="34.0" y="68.0" class="t-sub" text-anchor="start">Ten rungs, the software at each, and the feedback edges that make the ordering a lie. Rungs 8–10 are additions to the original seven-rung ladder.</text><rect x="96.0" y="116.0" width="990.0" height="74.0" rx="8" fill="var(--blue-f)" stroke="var(--blue)" stroke-width="2"/><path d="M 97.5 126 L 97.5 180" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="136.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="159.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">1</text><text x="116.0" y="141.0" class="t-node" text-anchor="start">Resource refinement</text><text x="116.0" y="161.0" class="t-tool" text-anchor="start">hifiasm · Verkko 2 · HapHiC · purge_dups · gfastats · compleasm · Merqury · CRAQ</text><text x="116.0" y="179.0" class="t-note" text-anchor="start">Is the substrate trustworthy?</text><rect x="96.0" y="202.0" width="990.0" height="74.0" rx="8" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 97.5 212 L 97.5 266" stroke="var(--gray)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="222.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="245.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">2</text><text x="116.0" y="227.0" class="t-node" text-anchor="start">Annotation as analysis</text><text x="116.0" y="247.0" class="t-tool" text-anchor="start">BRAKER4 · Helixer · GALBA · miniprot · Liftoff · OMArk · PSAURON · AGAT</text><text x="116.0" y="265.0" class="t-note" text-anchor="start">What are the parts, and are they real?</text><rect x="96.0" y="288.0" width="990.0" height="74.0" rx="8" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 97.5 298 L 97.5 352" stroke="var(--gray)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="308.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="331.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">3</text><text x="116.0" y="313.0" class="t-node" text-anchor="start">Comparative genomics</text><text x="116.0" y="333.0" class="t-tool" text-anchor="start">OrthoFinder3 · SonicParanoid2 · CAFE5 · HyPhy/aBSREL · GENESPACE · ksrates · SyRI</text><text x="116.0" y="351.0" class="t-note" text-anchor="start">What is lineage-specific — and under selection?</text><rect x="96.0" y="374.0" width="990.0" height="74.0" rx="8" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 97.5 384 L 97.5 438" stroke="var(--gray)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="394.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="417.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">4</text><text x="116.0" y="399.0" class="t-node" text-anchor="start">Pangenomics</text><text x="116.0" y="419.0" class="t-tool" text-anchor="start">Minigraph-Cactus · PGGB · vg giraffe · PanGenie · panEDTA · pangene</text><text x="116.0" y="437.0" class="t-note" text-anchor="start">Which genes vary, not just which exist?</text><rect x="96.0" y="460.0" width="990.0" height="74.0" rx="8" fill="var(--aqua-f)" stroke="var(--aqua)" stroke-width="2"/><path d="M 97.5 470 L 97.5 524" stroke="var(--aqua)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="480.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="503.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">5</text><text x="116.0" y="485.0" class="t-node" text-anchor="start">Networks &amp; integration</text><text x="116.0" y="505.0" class="t-tool" text-anchor="start">WGCNA · MOFA+ · CellChat · scvi-tools · Squidpy</text><text x="116.0" y="523.0" class="t-note" text-anchor="start">How do the parts act together?</text><rect x="96.0" y="546.0" width="990.0" height="74.0" rx="8" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 97.5 556 L 97.5 610" stroke="var(--gray)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="566.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="589.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">6</text><text x="116.0" y="571.0" class="t-node" text-anchor="start">Association → causation</text><text x="116.0" y="591.0" class="t-tool" text-anchor="start">SuSiE-RSS · PolyFun · coloc · TWAS · MR-Egger · kanpig · PRSice-2 · LDpred2</text><text x="116.0" y="609.0" class="t-note" text-anchor="start">Which variant actually does the thing?</text><rect x="96.0" y="632.0" width="990.0" height="74.0" rx="8" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 97.5 642 L 97.5 696" stroke="var(--gray)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="652.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="675.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">7</text><text x="116.0" y="657.0" class="t-node" text-anchor="start">Prediction &amp; generation</text><text x="116.0" y="677.0" class="t-tool" text-anchor="start">AlphaMissense · Borzoi · AlphaGenome · Evo 2 · PlantCAD · GBLUP</text><text x="116.0" y="695.0" class="t-note" text-anchor="start">Can we rank the search space before the bench?</text><rect x="96.0" y="718.0" width="990.0" height="74.0" rx="8" fill="var(--blue-f)" stroke="var(--blue)" stroke-width="2"/><path d="M 97.5 728 L 97.5 782" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="738.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="761.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">8</text><text x="116.0" y="743.0" class="t-node" text-anchor="start">Epigenome &amp; 3D genome</text><text x="116.0" y="763.0" class="t-tool" text-anchor="start">Dorado + modkit · jasmine · pb-CpG-tools · cooler · cooltools</text><text x="116.0" y="781.0" class="t-note" text-anchor="start">What is written on top of the sequence?</text><rect x="1018.0" y="730.0" width="54.0" height="19.0" rx="5" fill="var(--green)" stroke="none" stroke-width="0"/><text x="1045.0" y="743.0" class="t-edge" text-anchor="middle" style="fill:var(--surface)">NEW</text><rect x="96.0" y="804.0" width="990.0" height="74.0" rx="8" fill="var(--orange-f)" stroke="var(--orange)" stroke-width="2"/><path d="M 97.5 814 L 97.5 868" stroke="var(--orange)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="824.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="847.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">9</text><text x="116.0" y="829.0" class="t-node" text-anchor="start">Repeats as signal</text><text x="116.0" y="849.0" class="t-tool" text-anchor="start">TRASH · HiCAT · StringDecomposer · tidk · panEDTA · GraffiTE · TEforest</text><text x="116.0" y="867.0" class="t-note" text-anchor="start">What is the 85% we usually mask?</text><rect x="1018.0" y="816.0" width="54.0" height="19.0" rx="5" fill="var(--green)" stroke="none" stroke-width="0"/><text x="1045.0" y="829.0" class="t-edge" text-anchor="middle" style="fill:var(--surface)">NEW</text><rect x="96.0" y="890.0" width="990.0" height="74.0" rx="8" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 97.5 900 L 97.5 954" stroke="var(--gray)" stroke-width="4" stroke-linecap="round"/><rect x="42.0" y="910.0" width="46.0" height="34.0" rx="8" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.5"/><text x="65.0" y="933.0" class="t-node" text-anchor="middle" style="fill:var(--ink2)">10</text><text x="116.0" y="915.0" class="t-node" text-anchor="start">Orthogonal validation</text><text x="116.0" y="935.0" class="t-tool" text-anchor="start">proteogenomics (PRIDE) · GNPS molecular networking · CRISPR / heterologous expression</text><text x="116.0" y="953.0" class="t-note" text-anchor="start">Is any of this true outside a computer?</text><rect x="1018.0" y="902.0" width="54.0" height="19.0" rx="5" fill="var(--green)" stroke="none" stroke-width="0"/><text x="1045.0" y="915.0" class="t-edge" text-anchor="middle" style="fill:var(--surface)">NEW</text><path d="M 1090 239.0 L 1102 239.0 Q 1112 239.0, 1112 253.0 L 1112 311.0 Q 1112 325.0, 1102 325.0 L 1094 325.0" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arred)"/><text x="1292.0" y="243.0" class="t-edge" text-anchor="start">annotation quality gates orthology</text><path d="M 1090 841.0 L 1140 841.0 Q 1150 841.0, 1150 827.0 L 1150 425.0 Q 1150 411.0, 1140 411.0 L 1094 411.0" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arred)"/><text x="1292.0" y="845.0" class="t-edge" text-anchor="start">per-genome TE libraries corrupt PAV</text><path d="M 1090 927.0 L 1178 927.0 Q 1188 927.0, 1188 913.0 L 1188 253.0 Q 1188 239.0, 1178 239.0 L 1094 239.0" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arred)"/><text x="1292.0" y="931.0" class="t-edge" text-anchor="start">peptides falsify gene models</text><path d="M 1090 411.0 L 1216 411.0 Q 1226 411.0, 1226 425.0 L 1226 569.0 Q 1226 583.0, 1216 583.0 L 1094 583.0" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arred)"/><text x="1292.0" y="415.0" class="t-edge" text-anchor="start">PAV becomes a phenotype</text><path d="M 1090 755.0 L 1254 755.0 Q 1264 755.0, 1264 741.0 L 1264 511.0 Q 1264 497.0, 1254 497.0 L 1094 497.0" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arred)"/><text x="1292.0" y="759.0" class="t-edge" text-anchor="start">mQTL enter the network</text><path d="M 1090 669.0 L 1102 669.0 Q 1112 669.0, 1112 655.0 L 1112 597.0 Q 1112 583.0, 1102 583.0 L 1094 583.0" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arred)"/><text x="1292.0" y="673.0" class="t-edge" text-anchor="start">predictions are priors, not evidence</text><rect x="1512.0" y="116.0" width="214.0" height="300.0" rx="9" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="1530.0" y="142.0" class="t-node" text-anchor="start">Why it matters</text><text x="1530.0" y="168.0" class="t-note" text-anchor="start">The rungs are numbered for</text><text x="1530.0" y="187.0" class="t-note" text-anchor="start">teaching, not for scheduling.</text><text x="1530.0" y="206.0" class="t-note" text-anchor="start"></text><text x="1530.0" y="225.0" class="t-note" text-anchor="start">Rung 2 gates rung 3. Rung 9</text><text x="1530.0" y="244.0" class="t-note" text-anchor="start">silently corrupts rung 4. Rung</text><text x="1530.0" y="263.0" class="t-note" text-anchor="start">10 is the only rung that can</text><text x="1530.0" y="282.0" class="t-note" text-anchor="start">falsify rungs 1–9, and almost</text><text x="1530.0" y="301.0" class="t-note" text-anchor="start">nobody climbs it.</text><text x="1530.0" y="320.0" class="t-note" text-anchor="start"></text><text x="1530.0" y="339.0" class="t-note" text-anchor="start">Anything drawn as a clean</text><text x="1530.0" y="358.0" class="t-note" text-anchor="start">1→10 arrow is a diagram of an</text><text x="1530.0" y="377.0" class="t-note" text-anchor="start">intention, not of a project.</text><rect x="1512.0" y="436.0" width="214.0" height="176.0" rx="9" fill="var(--panel)" stroke="var(--rule)" stroke-width="1"/><text x="1530.0" y="462.0" class="t-node" text-anchor="start">Where a genome paper</text><text x="1530.0" y="480.0" class="t-node" text-anchor="start">usually stops</text><text x="1530.0" y="508.0" class="t-note" text-anchor="start">Rung 3, with a GO barplot.</text><text x="1530.0" y="530.0" class="t-note" text-anchor="start">Rungs 1–3 are resource</text><text x="1530.0" y="548.0" class="t-note" text-anchor="start">generation with a narrative</text><text x="1530.0" y="566.0" class="t-note" text-anchor="start">attached. The biology starts</text><text x="1530.0" y="584.0" class="t-note" text-anchor="start">at rung 4 and above.</text><rect x="42.0" y="1015.0" width="22.0" height="13.0" rx="3.5" fill="var(--blue-f)" stroke="var(--blue)" stroke-width="2"/><text x="72.0" y="1025.0" class="t-key" text-anchor="start">long-read DNA lineage</text><rect x="292.0" y="1015.0" width="22.0" height="13.0" rx="3.5" fill="var(--orange-f)" stroke="var(--orange)" stroke-width="2"/><text x="322.0" y="1025.0" class="t-key" text-anchor="start">Hi-C / repeat lineage</text><rect x="542.0" y="1015.0" width="22.0" height="13.0" rx="3.5" fill="var(--aqua-f)" stroke="var(--aqua)" stroke-width="2"/><text x="572.0" y="1025.0" class="t-key" text-anchor="start">RNA lineage</text><line x1="792.0" y1="1021.0" x2="814.0" y2="1021.0" stroke="var(--red)" stroke-width="2"/><text x="822.0" y="1025.0" class="t-key" text-anchor="start">feedback edge</text><text x="42.0" y="1058.0" class="t-note" text-anchor="start">Colour marks which data type a rung is anchored in; grey rungs are method layers that consume whatever the rungs above produced. Read the red edges as the real dependency graph.</text></svg>