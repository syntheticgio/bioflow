<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 800" class="viz" role="img">
<style>/* 04-annotation-fanin */
  .viz { --surface:#fcfcfb; --panel:#f4f2ee; --lane:#efece6;
         --ink:#0b0b0b; --ink2:#52514e; --ink3:#7d7a73; --rule:#ddd9d1;
         --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a;
         --gray:#6b6862; --red:#e34948; --green:#008300;
         --blue-f:#e8f1fc; --orange-f:#fdeee7; --aqua-f:#e4f6ef;
         --gray-f:#f0efec; --red-f:#fceceb; --green-f:#e8f3e8; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --panel:#232320; --lane:#26261f;
           --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f887d; --rule:#39382f;
           --blue:#3987e5; --orange:#d95926; --aqua:#199e70;
           --gray:#9c968b; --red:#e66767; --green:#3fa03f;
           --blue-f:#152232; --orange-f:#2b1d16; --aqua-f:#122622;
           --gray-f:#26251f; --red-f:#2c1c1b; --green-f:#16240f; }
  }
  .viz text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .t-title { font-size:23px; font-weight:650; fill:var(--ink); letter-spacing:-.2px }
  .t-sub   { font-size:13px; fill:var(--ink2) }
  .t-lane  { font-size:12px; font-weight:750; letter-spacing:.09em; text-transform:uppercase }
  .t-lane2 { font-size:10.5px; fill:var(--ink3) }
  .t-node  { font-size:12.5px; font-weight:640; fill:var(--ink) }
  .t-tool  { font-size:10.5px; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:var(--ink2) }
  .t-edge  { font-size:10px; font-weight:620; fill:var(--ink2) }
  .t-note  { font-size:11px; fill:var(--ink2) }
  .t-phase { font-size:9.5px; font-weight:750; letter-spacing:.08em; fill:var(--ink3) }
  .t-key   { font-size:11.5px; fill:var(--ink2) }
</style>
<defs><marker id="araqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--aqua)"/></marker><marker id="argray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--gray)"/></marker><marker id="arorange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--orange)"/></marker><marker id="arred" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--red)"/></marker></defs><rect width="1760" height="800" fill="var(--surface)"/><text x="34.0" y="44.0" class="t-title" text-anchor="start">4 · Annotation is a fan-in, not a step — six evidence streams, one combiner, three QC legs</text><text x="34.0" y="68.0" class="t-sub" text-anchor="start">The evidence hierarchy on the left is a ranking, not a menu: each tier is worth more than everything below it. Most annotations are weak because they used tier 3 alone.</text><rect x="34.0" y="84.0" width="320.0" height="496.0" rx="10" fill="var(--lane)" stroke="var(--rule)" stroke-width="1"/><text x="56.0" y="106.0" class="t-lane" text-anchor="start" style="fill:var(--gray)">Evidence — in rank order</text><text x="56.0" y="122.0" class="t-lane2" text-anchor="start">top tier beats everything below it combined</text><rect x="76.0" y="150.0" width="250.0" height="52.0" rx="7" fill="var(--aqua-f)" stroke="var(--aqua)" stroke-width="2"/><path d="M 77.2 158 L 77.2 194" stroke="var(--aqua)" stroke-width="3.5" stroke-linecap="round"/><text x="201.0" y="174.0" class="t-node" text-anchor="middle">Iso-Seq / FL-cDNA</text><text x="201.0" y="190.0" class="t-tool" text-anchor="middle">IsoQuant · SQANTI3 · TAMA</text><text x="66.0" y="180.0" class="t-phase" text-anchor="end">TIER 1</text><rect x="76.0" y="218.0" width="250.0" height="52.0" rx="7" fill="var(--aqua-f)" stroke="var(--aqua)" stroke-width="2"/><path d="M 77.2 226 L 77.2 262" stroke="var(--aqua)" stroke-width="3.5" stroke-linecap="round"/><text x="201.0" y="242.0" class="t-node" text-anchor="middle">short-read RNA-seq</text><text x="201.0" y="258.0" class="t-tool" text-anchor="middle">HISAT2/STAR → StringTie3</text><text x="66.0" y="248.0" class="t-phase" text-anchor="end">TIER 2</text><rect x="76.0" y="286.0" width="250.0" height="52.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 77.2 294 L 77.2 330" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="201.0" y="310.0" class="t-node" text-anchor="middle">close-relative annotation</text><text x="201.0" y="326.0" class="t-tool" text-anchor="middle">Liftoff  (miniprot cross-species)</text><text x="66.0" y="316.0" class="t-phase" text-anchor="end">TIER 3</text><rect x="76.0" y="354.0" width="250.0" height="52.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 77.2 362 L 77.2 398" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="201.0" y="378.0" class="t-node" text-anchor="middle">cross-species proteins</text><text x="201.0" y="394.0" class="t-tool" text-anchor="middle">miniprot · OrthoDB</text><text x="66.0" y="384.0" class="t-phase" text-anchor="end">TIER 3</text><rect x="76.0" y="422.0" width="250.0" height="52.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 77.2 430 L 77.2 466" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="201.0" y="446.0" class="t-node" text-anchor="middle">ab initio / deep learning</text><text x="201.0" y="462.0" class="t-tool" text-anchor="middle">Helixer · AUGUSTUS · GeneMark</text><text x="66.0" y="452.0" class="t-phase" text-anchor="end">TIER 4</text><rect x="76.0" y="490.0" width="250.0" height="52.0" rx="7" fill="var(--orange-f)" stroke="var(--orange)" stroke-width="2"/><path d="M 77.2 498 L 77.2 534" stroke="var(--orange)" stroke-width="3.5" stroke-linecap="round"/><text x="201.0" y="514.0" class="t-node" text-anchor="middle">repeat library</text><text x="201.0" y="530.0" class="t-tool" text-anchor="middle">EDTA → TEtrimmer → RepeatMasker</text><text x="66.0" y="520.0" class="t-phase" text-anchor="end">PRE-REQ</text><text x="56.0" y="564.0" class="t-note" text-anchor="start">Rank matters because the combiner</text><text x="56.0" y="582.0" class="t-note" text-anchor="start">resolves conflicts by evidence weight —</text><text x="56.0" y="600.0" class="t-note" text-anchor="start">feed it tier 4 only and it will happily</text><text x="56.0" y="618.0" class="t-note" text-anchor="start">produce a confident, fragmented genome.</text><rect x="430.0" y="490.0" width="200.0" height="52.0" rx="7" fill="var(--orange-f)" stroke="var(--orange)" stroke-width="2"/><path d="M 431.2 498 L 431.2 534" stroke="var(--orange)" stroke-width="3.5" stroke-linecap="round"/><text x="530.0" y="514.0" class="t-node" text-anchor="middle">soft-mask the genome</text><text x="530.0" y="530.0" class="t-tool" text-anchor="middle">RepeatMasker</text><rect x="470.0" y="280.0" width="232.0" height="74.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 471.2 288 L 471.2 346" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="586.0" y="315.0" class="t-node" text-anchor="middle">combiner</text><text x="586.0" y="331.0" class="t-tool" text-anchor="middle">BRAKER4  ·  EVidenceModeler 2</text><rect x="470.0" y="280.0" width="232.0" height="74.0" rx="7" fill="none" stroke="var(--gray)" stroke-width="2"/><path d="M 330 176.0 C 410 176.0, 410 317, 464 317" fill="none" stroke="var(--aqua)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#araqua)"/><path d="M 330 244.0 C 410 244.0, 410 317, 464 317" fill="none" stroke="var(--aqua)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#araqua)"/><path d="M 330 312.0 C 410 312.0, 410 317, 464 317" fill="none" stroke="var(--gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#argray)"/><path d="M 330 380.0 C 410 380.0, 410 317, 464 317" fill="none" stroke="var(--gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#argray)"/><path d="M 330 448.0 C 410 448.0, 410 317, 464 317" fill="none" stroke="var(--gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#argray)"/><path d="M 330 516.0 L 424 516.0" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arorange)"/><path d="M 530.0 484 C 530.0 400, 586.0 400, 586.0 360" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arorange)"/><text x="646.0" y="414.0" class="t-edge" text-anchor="start">masking must precede prediction —</text><text x="646.0" y="428.0" class="t-edge" text-anchor="start">unmasked repeats become fake genes</text><rect x="760.0" y="291.0" width="176.0" height="52.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 761.2 299 L 761.2 335" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="848.0" y="315.0" class="t-node" text-anchor="middle">structural GFF3</text><text x="848.0" y="331.0" class="t-tool" text-anchor="middle">one model set</text><path d="M 706 317.0 L 754 317.0" fill="none" stroke="var(--gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#argray)"/><rect x="988.0" y="84.0" width="402.0" height="396.0" rx="10" fill="var(--lane)" stroke="var(--rule)" stroke-width="1"/><text x="1004.0" y="106.0" class="t-lane" text-anchor="start" style="fill:var(--gray)">QC — three legs, not one</text><text x="1004.0" y="122.0" class="t-lane2" text-anchor="start">BUSCO alone is 2019-era practice</text><rect x="1010.0" y="150.0" width="356.0" height="56.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 1011.2 158 L 1011.2 198" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="1188.0" y="176.0" class="t-node" text-anchor="middle">completeness</text><text x="1188.0" y="192.0" class="t-tool" text-anchor="middle">compleasm · BUSCO odb12</text><text x="1018.0" y="221.0" class="t-note" text-anchor="start">did we find the genes?</text><rect x="1010.0" y="230.0" width="356.0" height="56.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 1011.2 238 L 1011.2 278" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="1188.0" y="256.0" class="t-node" text-anchor="middle">repertoire + contamination</text><text x="1188.0" y="272.0" class="t-tool" text-anchor="middle">OMArk</text><text x="1018.0" y="301.0" class="t-note" text-anchor="start">are they the RIGHT genes?</text><rect x="1010.0" y="310.0" width="356.0" height="56.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 1011.2 318 L 1011.2 358" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="1188.0" y="336.0" class="t-node" text-anchor="middle">per-model plausibility</text><text x="1188.0" y="352.0" class="t-tool" text-anchor="middle">PSAURON</text><text x="1018.0" y="381.0" class="t-note" text-anchor="start">do they look like proteins?</text><rect x="1010.0" y="390.0" width="356.0" height="56.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 1011.2 398 L 1011.2 438" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="1188.0" y="416.0" class="t-node" text-anchor="middle">format integrity</text><text x="1188.0" y="432.0" class="t-tool" text-anchor="middle">AGAT</text><text x="1018.0" y="461.0" class="t-note" text-anchor="start">will anything downstream parse it?</text><path d="M 1018 210 L 1018 224" fill="none" stroke="var(--gray)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#argray)"/><path d="M 1018 290 L 1018 304" fill="none" stroke="var(--gray)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#argray)"/><path d="M 1018 370 L 1018 384" fill="none" stroke="var(--gray)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#argray)"/><path d="M 940 317 C 970 317, 970 178, 1004 178" fill="none" stroke="var(--gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#argray)"/><path d="M 1018 290 C 920 708, 200 708, 334 176.0" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arred)"/><text x="700.0" y="700.0" class="t-edge" text-anchor="middle">OMArk flags fragmented or spurious models → the fix is almost never a better predictor, it is more evidence:</text><text x="700.0" y="716.0" class="t-edge" text-anchor="middle">add Iso-Seq, or find a closer relative to lift from</text><rect x="1010.0" y="506.0" width="172.0" height="52.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 1011.2 514 L 1011.2 550" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="1096.0" y="530.0" class="t-node" text-anchor="middle">functional layer</text><text x="1096.0" y="546.0" class="t-tool" text-anchor="middle">InterProScan · eggNOG</text><rect x="1200.0" y="506.0" width="166.0" height="52.0" rx="7" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><path d="M 1201.2 514 L 1201.2 550" stroke="var(--gray)" stroke-width="3.5" stroke-linecap="round"/><text x="1283.0" y="530.0" class="t-node" text-anchor="middle">ncRNA</text><text x="1283.0" y="546.0" class="t-tool" text-anchor="middle">tRNAscan · Infernal</text><path d="M 1018 450 L 1018 500" fill="none" stroke="var(--gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#argray)"/><text x="1010.0" y="582.0" class="t-note" text-anchor="start">The first edition's Phase 9 stopped at the structural GFF.</text><text x="1010.0" y="600.0" class="t-note" text-anchor="start">Both boxes above are required deliverables, not extras.</text><rect x="400.0" y="574.0" width="500.0" height="52.0" rx="7" fill="var(--green-f)" stroke="var(--green)" stroke-width="1.2"/><text x="650.0" y="598.0" class="t-node" text-anchor="middle">→ everything in diagram 5 consumes this GFF</text><text x="650.0" y="614.0" class="t-tool" text-anchor="middle">a wrong gene model propagates silently into every rung above</text><rect x="42.0" y="739.0" width="22.0" height="13.0" rx="3.5" fill="var(--aqua-f)" stroke="var(--aqua)" stroke-width="2"/><text x="72.0" y="749.0" class="t-key" text-anchor="start">RNA evidence</text><rect x="292.0" y="739.0" width="22.0" height="13.0" rx="3.5" fill="var(--orange-f)" stroke="var(--orange)" stroke-width="2"/><text x="322.0" y="749.0" class="t-key" text-anchor="start">repeat evidence</text><rect x="542.0" y="739.0" width="22.0" height="13.0" rx="3.5" fill="var(--gray-f)" stroke="var(--gray)" stroke-width="2"/><text x="572.0" y="749.0" class="t-key" text-anchor="start">method / derived</text><line x1="792.0" y1="745.0" x2="814.0" y2="745.0" stroke="var(--red)" stroke-width="2"/><text x="822.0" y="749.0" class="t-key" text-anchor="start">QC failure → add evidence</text><text x="42.0" y="782.0" class="t-note" text-anchor="start">Read this as a ranking problem, not a plumbing problem. Annotation tools differ far less than the evidence you feed them — which is why 'annotation quality dominates orthology results' is the single most load-bearing finding in the guide.</text></svg>