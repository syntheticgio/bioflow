# The reads path: upload -> QC -> trim -> align -> assert a BAM that maps.
#
# This follows the flow an agent actually takes rather than a shortcut through
# `run_pipeline`: each pipeline is started by asking `suggest_next` what can
# run against the object and POSTing that card's own `launch` body (see the
# `launch` step in e2e/backend/runner.py). Nothing here hand-builds a handler
# payload, so the test tracks the launch endpoints instead of drifting from
# them.
#
# Ordering is not arbitrary. The align card is UNAVAILABLE until QC has run,
# because it needs the read chemistry QC infers -- so "QC before align" is a
# real precondition of the application, not a stylistic choice about how to
# write the test.
#
# The fixtures are generated by e2e/fixtures/make_fixtures.py: reads that are
# exact substrings of `reference.fna`, with an adapter on R1. That is what
# lets the last assertion check a *mapping rate* -- random reads would
# produce a BAM just as happily while mapping nothing.
name: reads-path
description: "upload reads + reference -> QC -> trim -> align -> assert BAM maps"
steps:
  - create_project: { name: "e2e-reads-{{run_id}}" }

  # The reference goes in first. The align card needs exactly one usable
  # reference in the project; with none it reports "No reference is
  # available." and never becomes launchable.
  - upload: { file: "reference.fna", as: ref }
  - upload: { file: "reads_R1.fastq.gz", as: r1 }
  - upload: { file: "reads_R2.fastq.gz", as: r2 }

  # An upload returns as soon as the bytes are stored, with the object still
  # `ingesting` while format detection runs -- so launching straight away is
  # rejected with "is not ready to QC (status=ingesting)". Waiting for READY
  # is a real precondition of the API, not harness politeness.
  - wait: { tool: get_object, as: refready, args: { object_id: "$.ref.id" },
            field: status, until: ready, timeout: 300, poll: 2 }
  - wait: { tool: get_object, as: r1ready, args: { object_id: "$.r1.id" },
            field: status, until: ready, timeout: 300, poll: 2 }
  - wait: { tool: get_object, as: r2ready, args: { object_id: "$.r2.id" },
            field: status, until: ready, timeout: 300, poll: 2 }

  # Ingest assigns no role to a plain upload, and the align card counts only
  # objects whose role *is* REFERENCE -- deliberately, so a project's
  # `protein.faa` is never offered as a genome to align against. Marking the
  # FASTA is what a user does in the UI; without it the card stays
  # UNAVAILABLE with "Upload a reference to align." beside a reference that
  # is sitting right there.
  - patch: { object_id: "$.ref.id", body: { role: "reference" } }

  # --- QC -------------------------------------------------------------
  # QC has no suggestion card -- it is launched from the UI's QC tab, not the
  # Actions grid -- so this is the explicit-endpoint form. Its body is only
  # `{object_id}`, so there is no server-built payload for a card lookup to
  # track. Only R1 is named: the launch endpoints pair the mate themselves.
  - launch: { endpoint: "/pipelines/qc", body: { object_id: "$.r1.id" }, as: qc }
  - wait: { tool: get_job, as: qcjob, args: { job_id: "$.qc.id" }, timeout: 900 }
  - assert: { fact: "$.qcjob.state", equals: "succeeded" }

  # --- Trim -----------------------------------------------------------
  - mcp: { tool: suggest_next, as: suggest, args: { object_id: "$.r1.id" } }
  - launch: { kind: preprocess, from: "$.suggest", as: trim }
  - wait: { tool: get_job, as: trimjob, args: { job_id: "$.trim.id" }, timeout: 900 }
  - assert: { fact: "$.trimjob.state", equals: "succeeded" }

  # --- Align ----------------------------------------------------------
  # Re-asking after QC is the point: this card was unavailable before it.
  - mcp: { tool: suggest_next, as: suggest, args: { object_id: "$.r1.id" } }
  - launch: { kind: align, from: "$.suggest", as: align }
  - wait: { tool: get_job, as: alignjob, args: { job_id: "$.align.id" }, timeout: 1800 }
  - assert: { fact: "$.alignjob.state", equals: "succeeded" }

  # --- The BAM --------------------------------------------------------
  # Reached through `list_objects` because `get_job` does not return a job's
  # result -- the same route a user takes to find what a run produced.
  - mcp: { tool: list_objects, as: objs, args: { project_id: "$.project_id" } }
  - assert: { fact: "$.objs.objects", contains_format: "bam" }
  - find: { in: "$.objs.objects", where: { format: "bam" }, as: bam }

  # The flagstat numbers are recorded by `index_bam`, which the align flow
  # queues for the BAM it produced -- so the mapping rate appears without
  # asking for anything further. `mapped_pct` is what this waits on; it is
  # absent until that job's result is applied.
  #
  # Read over REST, not through the `get_object` MCP tool: that tool returns
  # only `metadata`, and flagstat's numbers live in `facts`.
  - wait: { tool: get_object, as: bamready, args: { object_id: "$.bam.id" },
            field: status, until: ready, timeout: 600, poll: 2 }
  - get_object: { object_id: "$.bam.id", as: bamobj, await_fact: mapped_pct,
                  timeout: 600, poll: 2 }

  # The assertion that makes the whole test mean something. The reads are
  # substrings of the reference, so essentially all of them must map; 90%
  # leaves room for edge behaviour without admitting a wrong index, which
  # would score near zero.
  - assert: { fact: "$.bamobj.facts.mapped_pct", at_least: 90 }
